[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-railway-migrator"
version = "0.1.0"
description = "Export Hermes Agent sessions from the web dashboard and import them into a local Hermes state.db"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Hermes Agent community"}]
keywords = ["hermes-agent", "migration", "railway", "sqlite", "sessions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database",
  "Topic :: System :: Archiving",
]

[project.scripts]
hermes-railway-migrator = "hermes_railway_migrator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_railway_migrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
